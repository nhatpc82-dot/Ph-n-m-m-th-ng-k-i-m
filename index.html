  <head>
    <meta charset="UTF-8" />

    <script>
      (function() {
        // Protect window.fetch assignment from browser extensions (e.g. Urban VPN requests.js)
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              var _protoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return _protoFetch; },
                set: function(val) { _protoFetch = val; }
              });
            }
          } catch (_) {}
        }

        // Suppress unhandled errors originating from browser extensions
        window.addEventListener('error', function(event) {
          var file = event.filename || '';
          var msg = event.message || '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event.reason && (event.reason.message || event.reason.stack || '')) || '';
          if (
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
